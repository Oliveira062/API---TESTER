name: API tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the API
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 4
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run api-tester
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: java -jar tools/api-tester.jar qa/ --no-color --reports qa-reports

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: qa-reports/
